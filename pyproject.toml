[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-claude"
version = "1.0.0"
description = "ModelScope Claude Code Proxy - lightweight model failover proxy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["proxy", "llm", "failover", "modelscope", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
fetcher = ["playwright>=1.42.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "black>=23.0.0", "flake8>=6.0.0"]
all = ["playwright>=1.42.0", "pytest>=7.4.0", "pytest-asyncio>=0.21.0", "black>=23.0.0", "flake8>=6.0.0"]

[project.scripts]
ms-claude = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt"]
