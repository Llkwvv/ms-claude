# ModelScope API 配置
modelscope:
  api_base: "https://modelscope.cn/api/v1"
  fetch_script_path: ""
  # 更新频率（cron表达式）
  # 默认：每天首次启动时更新（这里配置为每天凌晨2点）
  update_schedule: "0 2 * * *"
  # 模型列表缓存时间（秒）
  cache_ttl: 86400  # 24小时

# 额度感知配置
quota:
  # 检查额度失败的阈值
  # 当返回特定错误码时触发切换
  error_codes:
    - "quota_exceeded"
    - "rate_limit_exceeded"
    - "insufficient_quota"
  # 请求失败重试次数（每个模型）
  max_retries: 3
  # 重试间隔（秒）
  retry_delay: 1

# 失败记录配置
failure_tracking:
  # 启用失败记录
  enabled: true
  # 记录文件路径
  log_file: "logs/failures.jsonl"
  # 失败阈值（达到后自动降低优先级）
  failure_threshold: 5
  # 时间窗口（秒）
  time_window: 3600  # 1小时

# 流式响应配置
streaming:
  # 是否启用流式支持
  enabled: true
  # 流式超时（秒）
  timeout: 300
  # 缓冲区大小
  buffer_size: 1024

# 日志配置
logging:
  level: "INFO"
  log_file: "logs/proxy.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 代理配置
proxy:
  # 超时时间（秒）
  timeout: 60
  # 连接超时
  connect_timeout: 10
  # 是否自动重试下一个模型
  auto_retry: true
  # 本地代理监听地址
  host: "127.0.0.1"
  port: 8080
  # 上游模型服务（OpenAI 或 Anthropic 兼容）
  upstream_base_url: "https://api-inference.modelscope.cn"
  upstream_api_key: ""
  upstream_api_key_env: "MS_CLAUDE_UPSTREAM_API_KEY"
  upstream_type: "openai"
